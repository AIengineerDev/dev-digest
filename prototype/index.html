<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0F1419">
<meta name="description" content="Interactive prototype of the DevDigest artefact catalog: search, facets, artefact detail, boundaries, relationship graph and bundle builder.">
<meta property="og:type" content="website">
<meta property="og:title" content="Artefact Catalog — prototype">
<meta property="og:description" content="Search 22 real skills, agents, hooks and MCP tools. Dark-first, no backend.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F1419'/%3E%3Crect x='7' y='9' width='18' height='3.4' rx='1.7' fill='%23D6A241'/%3E%3Crect x='7' y='15' width='13' height='3.4' rx='1.7' fill='%236FA8DC'/%3E%3Crect x='7' y='21' width='9' height='3.4' rx='1.7' fill='%2358AE93'/%3E%3C/svg%3E">
<style>
/* Minimal reset. The Artifact runtime supplies one; GitHub Pages does not, so
   it ships with the page. Keep it above the token block so tokens win. */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
img,svg,video{max-width:100%;height:auto}
h1,h2,h3,h4,h5,p,figure,blockquote{margin:0}
ul[class],ol[class]{list-style:none;margin:0;padding:0}
button{background:none;border:0;font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
</style>
<title>Artefact Catalog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ─── Tokens ───────────────────────────────────────────────────────────────
   Dark-first by request. The bare :root carries the DARK palette, so the
   un-stamped "system" state and an explicit dark choice both resolve dark.
   Light is opt-in: prefers-color-scheme:light (guarded so an explicit dark
   choice wins) and [data-theme="light"] for the toggle.                    */
:root {
  --bg:        #0F1419;
  --surface:   #161D24;
  --surface-2: #1D262F;
  --surface-3: #253039;
  --line:      #2B3742;
  --line-soft: #212B34;
  --ink:       #E1E7ED;
  --ink-dim:   #96A3B0;
  --ink-faint: #66727E;
  --accent:    #D6A241;
  --accent-2:  #F0BC5C;
  --on-accent: #171104;
  --ok:        #58AE93;
  --note:      #7E8C9B;
  --crit:      #D2685C;
  --mark:      #4A3A16;
  --mark-ink:  #F4CE7C;
  --shadow:    0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #EEF1F3;
    --surface:   #FFFFFF;
    --surface-2: #E6EAEE;
    --surface-3: #DCE2E7;
    --line:      #CCD4DA;
    --line-soft: #DFE5EA;
    --ink:       #141C24;
    --ink-dim:   #4F5D6A;
    --ink-faint: #75828E;
    --accent:    #8A5D0C;
    --accent-2:  #6E4A08;
    --on-accent: #FFF8EA;
    --ok:        #2F7460;
    --note:      #5C6975;
    --crit:      #A63C30;
    --mark:      #F6E3B4;
    --mark-ink:  #4A3405;
    --shadow:    0 1px 0 rgba(255,255,255,.6), 0 6px 18px rgba(20,28,36,.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:        #EEF1F3;
  --surface:   #FFFFFF;
  --surface-2: #E6EAEE;
  --surface-3: #DCE2E7;
  --line:      #CCD4DA;
  --line-soft: #DFE5EA;
  --ink:       #141C24;
  --ink-dim:   #4F5D6A;
  --ink-faint: #75828E;
  --accent:    #8A5D0C;
  --accent-2:  #6E4A08;
  --on-accent: #FFF8EA;
  --ok:        #2F7460;
  --note:      #5C6975;
  --crit:      #A63C30;
  --mark:      #F6E3B4;
  --mark-ink:  #4A3405;
  --shadow:    0 1px 0 rgba(255,255,255,.6), 0 6px 18px rgba(20,28,36,.10);
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 Archivo, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
code, .mono, .path { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ─── App shell ─────────────────────────────────────────────────────────── */
.top {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 20px;
  padding: 0 20px; height: 56px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 9px; margin-right: 4px; }
.brand b { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.brand span {
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
  color: var(--ink-faint); text-transform: uppercase; letter-spacing: .09em;
}
.nav { display: flex; gap: 2px; }
.nav button {
  background: none; border: 0; padding: 7px 12px; border-radius: 6px;
  color: var(--ink-dim); font-size: 13.5px; font-weight: 500;
}
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--surface-3); color: var(--ink); }
.top .spacer { flex: 1; }
.iconbtn {
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 11px; font-size: 12.5px; color: var(--ink-dim);
}
.iconbtn:hover { color: var(--ink); border-color: var(--ink-faint); }

.wrap { max-width: 1240px; margin: 0 auto; padding: 22px 20px 120px; }
.cols { display: grid; grid-template-columns: 216px minmax(0,1fr); gap: 26px; align-items: start; }
@media (max-width: 880px) { .cols { grid-template-columns: 1fr; } .rail { order: 2; } }

/* ─── Search ────────────────────────────────────────────────────────────── */
.searchrow { display: flex; gap: 10px; margin-bottom: 6px; }
.searchbox { position: relative; flex: 1; }
.searchbox input {
  width: 100%; padding: 13px 15px 13px 40px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
  font-size: 15.5px;
}
.searchbox input::placeholder { color: var(--ink-faint); }
.searchbox input:focus { border-color: var(--accent); outline: none; }
.searchbox svg { position: absolute; left: 14px; top: 15px; opacity: .5; }
.hintline {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  margin: 0 0 22px; font-size: 12.5px; color: var(--ink-faint);
}
.hintline b { font-weight: 500; color: var(--ink-dim); }
.chip {
  background: var(--surface-2); border: 1px solid var(--line-soft);
  border-radius: 20px; padding: 3px 10px; font-size: 12px; color: var(--ink-dim);
  font-family: "IBM Plex Mono", monospace;
}
.chip:hover { border-color: var(--accent); color: var(--ink); }

/* ─── Facet rail ────────────────────────────────────────────────────────── */
.rail { position: sticky; top: 78px; display: flex; flex-direction: column; gap: 22px; }
.facet h3 {
  margin: 0 0 9px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-faint);
  font-family: "IBM Plex Mono", monospace;
}
.facet ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.facet li button {
  width: 100%; display: flex; align-items: center; gap: 8px;
  background: none; border: 0; padding: 5px 8px; border-radius: 5px;
  font-size: 13.5px; color: var(--ink-dim); text-align: left;
}
.facet li button:hover { background: var(--surface-2); color: var(--ink); }
.facet li button.on { background: var(--surface-3); color: var(--ink); font-weight: 500; }
.facet .dot { width: 7px; height: 7px; border-radius: 2px; flex: 0 0 auto; }
.facet .n {
  margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
  color: var(--ink-faint); font-variant-numeric: tabular-nums;
}
.clearfilters {
  background: none; border: 1px dashed var(--line); border-radius: 6px;
  padding: 6px; font-size: 12px; color: var(--ink-dim); width: 100%;
}
.clearfilters:hover { border-color: var(--crit); color: var(--crit); border-style: solid; }

/* ─── Cards ─────────────────────────────────────────────────────────────── */
.groupbar {
  display: flex; align-items: center; gap: 10px; margin: 26px 0 12px;
  font-family: "IBM Plex Mono", monospace; font-size: 11px;
  letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint);
}
.groupbar::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
.groupbar:first-child { margin-top: 4px; }

.cards { display: flex; flex-direction: column; gap: 9px; }
.card {
  position: relative; display: grid;
  grid-template-columns: 22px minmax(0,1fr) auto; gap: 0 13px;
  padding: 14px 15px; background: var(--surface);
  border: 1px solid var(--line-soft); border-radius: 9px;
  border-left: 3px solid var(--tc, var(--line));
  transition: border-color .12s, background .12s;
}
.card:hover { border-color: var(--line); border-left-color: var(--tc); background: var(--surface-2); }
.card.sel { border-color: var(--accent); }
.card .pick {
  grid-row: 1 / span 3; align-self: start; margin-top: 2px;
  width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer;
}
.card h4 { margin: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -.005em; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.card h4 button {
  background: none; border: 0; padding: 0; font: inherit; color: var(--ink);
  text-align: left; text-decoration-color: transparent;
}
.card h4 button:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.card .path {
  grid-column: 2; font-size: 11.5px; color: var(--ink-faint);
  margin: 3px 0 7px; word-break: break-all;
}
.card .desc { grid-column: 2; margin: 0; font-size: 13.5px; color: var(--ink-dim); line-height: 1.5; }
.card .desc.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .triggers { grid-column: 2; display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.trig {
  font-family: "IBM Plex Mono", monospace; font-size: 11px;
  background: var(--surface-3); color: var(--ink-dim);
  padding: 2px 7px; border-radius: 4px;
}
.card .side { grid-column: 3; grid-row: 1 / span 4; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }

.badge {
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 500;
  letter-spacing: .05em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 4px; white-space: nowrap;
}
.badge.type { background: var(--tcbg); color: var(--tc); }
.badge.ver { background: var(--surface-3); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.badge.ev-ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.badge.ev-none { background: var(--surface-3); color: var(--note); }
.plugin { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-faint); }
.copy {
  background: var(--surface-3); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 10px; font-size: 12px; color: var(--ink-dim); white-space: nowrap;
}
.copy:hover { border-color: var(--accent); color: var(--accent); }
.copy.done { border-color: var(--ok); color: var(--ok); }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }

/* ─── Empty / zero states ───────────────────────────────────────────────── */
.state {
  border: 1px dashed var(--line); border-radius: 11px; padding: 34px 30px;
  background: var(--surface); text-align: left;
}
.state h3 { margin: 0 0 9px; font-size: 18px; font-weight: 600; }
.state p { margin: 0 0 16px; color: var(--ink-dim); font-size: 14px; max-width: 62ch; }
.state .near { display: flex; flex-direction: column; gap: 7px; margin: 0 0 18px; }
.state .near button {
  display: flex; gap: 10px; align-items: baseline; text-align: left;
  background: var(--surface-2); border: 1px solid var(--line-soft);
  border-radius: 7px; padding: 9px 12px; font-size: 13px; color: var(--ink-dim);
}
.state .near button:hover { border-color: var(--accent); color: var(--ink); }
.state .near .k { font-family: "IBM Plex Mono", monospace; color: var(--accent); font-size: 12.5px; }
.btn {
  background: var(--accent); color: var(--on-accent); border: 0;
  border-radius: 7px; padding: 9px 15px; font-size: 13.5px; font-weight: 600;
}
.btn:hover { background: var(--accent-2); }
.btn.ghost { background: none; color: var(--ink-dim); border: 1px solid var(--line); font-weight: 500; }
.btn.ghost:hover { color: var(--ink); border-color: var(--ink-faint); }

/* ─── Detail ────────────────────────────────────────────────────────────── */
.detail { max-width: 860px; }
.crumb {
  display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
  font-size: 13px; color: var(--ink-faint);
}
.crumb button { background: none; border: 0; color: var(--ink-dim); padding: 0; font-size: 13px; }
.crumb button:hover { color: var(--accent); }
.detail h1 { margin: 0 0 5px; font-size: 30px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.detail .sub { font-size: 12.5px; color: var(--ink-faint); margin-bottom: 18px; word-break: break-all; }
.detail .sub a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.detailbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.fm {
  width: 100%; border-collapse: collapse; margin: 0 0 26px;
  font-size: 13.5px; background: var(--surface);
  border: 1px solid var(--line-soft); border-radius: 9px; overflow: hidden;
}
.fm th, .fm td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.fm tr:last-child th, .fm tr:last-child td { border-bottom: 0; }
.fm th {
  width: 190px; font-weight: 500; color: var(--ink-faint);
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
}
.fm td { color: var(--ink); font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
.sec { margin: 0 0 12px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; }
.body {
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: 9px; padding: 18px 20px; margin-bottom: 26px;
  font-size: 14px; line-height: 1.62; color: var(--ink-dim); max-width: 68ch;
}
.body p { margin: 0 0 12px; }
.body p:last-child { margin: 0; }
.pairs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
.pair {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  border: 1px solid var(--line-soft); border-radius: 9px; overflow: hidden; background: var(--surface);
}
@media (max-width: 700px) { .pair { grid-template-columns: 1fr; } }
.pair > div { padding: 14px 16px; }
.pair > div + div { border-left: 1px solid var(--line-soft); }
@media (max-width: 700px) { .pair > div + div { border-left: 0; border-top: 1px solid var(--line-soft); } }
.pair h5 { margin: 0 0 7px; font-size: 14px; font-weight: 600; font-family: "IBM Plex Mono", monospace; }
.pair q { font-size: 13px; color: var(--ink-dim); font-style: normal; line-height: 1.5; }
.pair .src { display: block; margin-top: 9px; font-size: 11px; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; }
.log { display: flex; flex-direction: column; gap: 0; margin-bottom: 26px; }
.log div {
  display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line-soft);
  font-size: 13px; color: var(--ink-dim);
}
.log time { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); flex: 0 0 88px; font-variant-numeric: tabular-nums; }
.log code { font-size: 12px; color: var(--ink-faint); }

/* ─── Bundle tray ───────────────────────────────────────────────────────── */
.tray {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: var(--surface); border-top: 1px solid var(--line);
  box-shadow: 0 -8px 28px rgba(0,0,0,.28);
  transform: translateY(100%); transition: transform .18s ease;
}
.tray.up { transform: translateY(0); }
.trayin { max-width: 1240px; margin: 0 auto; padding: 13px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.trayin .cnt { font-size: 13.5px; color: var(--ink-dim); }
.trayin .cnt b { color: var(--ink); font-variant-numeric: tabular-nums; }
.trayin .names { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; min-width: 120px; }
.trayin .names span {
  font-family: "IBM Plex Mono", monospace; font-size: 11px;
  background: var(--surface-3); color: var(--ink-dim); padding: 2px 7px; border-radius: 4px;
}
pre.out {
  margin: 0; padding: 16px 18px; background: var(--surface-2);
  border: 1px solid var(--line-soft); border-radius: 9px;
  font-family: "IBM Plex Mono", monospace; font-size: 12.5px; line-height: 1.6;
  color: var(--ink); overflow-x: auto;
}
pre.out .k { color: var(--accent); }
pre.out .s { color: var(--ok); }

/* ─── Graph ─────────────────────────────────────────────────────────────── */
.graphwrap { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 11px; padding: 8px; overflow-x: auto; }
.graphwrap svg { display: block; min-width: 640px; }
.gnode text { font-family: "IBM Plex Mono", monospace; font-size: 11px; fill: var(--ink); }
.gnode rect { fill: var(--surface-2); stroke: var(--line); }
.gnode:hover rect { stroke: var(--accent); }
.gedge { stroke: var(--line); stroke-width: 1.25; fill: none; }
.gedge.hi { stroke: var(--accent); stroke-width: 2; }
.elabel { font-family: "IBM Plex Mono", monospace; font-size: 9.5px; fill: var(--ink-faint); }

.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 14px 0 0; font-size: 12px; color: var(--ink-faint); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: block; }

.note {
  border-left: 2px solid var(--accent); background: var(--surface);
  padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 0 0 24px;
  font-size: 13px; color: var(--ink-dim); max-width: 76ch;
}
.note b { color: var(--ink); font-weight: 600; }
.toast {
  position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%) translateY(14px);
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 7px;
  font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all .16s; z-index: 60;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.h { display: none; }

/* ─── data-driven states ────────────────────────────────────────────────── */
.railnote { margin:0; font-size:12px; line-height:1.5; color:var(--ink-faint); }
.railnote code { font-size:11px; word-break:break-all; }
.plugin.none { color:var(--ink-faint); opacity:.75; font-style:italic; }
.copy[disabled] { opacity:.5; cursor:not-allowed; }
.copy[disabled]:hover { border-color:var(--line); color:var(--ink-dim); }
.pick[disabled] { opacity:.35; cursor:not-allowed; }
.linkish { background:none; border:0; padding:0; font:inherit; color:var(--accent); }
.linkish:hover { text-decoration:underline; text-underline-offset:3px; }
q.dim { color:var(--ink-faint); font-style:italic; }
.diag { border:1px solid var(--line-soft); border-radius:9px; background:var(--surface);
        margin:0 0 22px; padding:0 16px; }
.diag summary { cursor:pointer; padding:12px 0; font-size:13px; color:var(--ink-dim);
        font-weight:500; }
.diag summary:hover { color:var(--ink); }
.diag[open] summary { border-bottom:1px solid var(--line-soft); margin-bottom:4px; }
.drow { display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line-soft); }
.drow:last-child { border-bottom:0; }
.drow code { font-size:11.5px; color:var(--ink); }
.drow p { margin:5px 0 0; font-size:12.5px; color:var(--ink-dim); line-height:1.5; max-width:74ch; }
.dsev { font-family:"IBM Plex Mono",monospace; font-size:10px; text-transform:uppercase;
        letter-spacing:.05em; padding:2px 7px; border-radius:4px; height:fit-content;
        flex:0 0 auto; }
.dsev.info { background:var(--surface-3); color:var(--ink-dim); }
.dsev.warning { background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--accent); }
.dsev.error { background:color-mix(in srgb, var(--crit) 18%, transparent); color:var(--crit); }
.state code, .note code { font-family:"IBM Plex Mono",monospace; font-size:.9em;
        background:var(--surface-3); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Artefact Catalog</b><span>dev-digest</span></div>
  <nav class="nav" id="nav">
    <button data-view="catalog" aria-current="page">Catalog</button>
    <button data-view="graph">Graph</button>
    <button data-view="boundaries">Boundaries</button>
    <button data-view="bundle">Bundle</button>
  </nav>
  <div class="spacer"></div>
  <button class="iconbtn" id="theme">Light</button>
</header>

<main class="wrap" id="root"></main>

<div class="tray" id="tray"><div class="trayin">
  <span class="cnt"><b id="trayn">0</b> selected</span>
  <div class="names" id="traynames"></div>
  <button class="btn ghost" id="trayclear">Clear</button>
  <button class="btn" id="traygo">Build settings.json</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   The catalog is FETCHED, never authored here. scripts/build-catalog.mjs reads
   this repository and emits catalog.json; this file only renders it. Nothing
   below invents a name, a description, a version or a plugin — where the repo
   has no answer yet, the UI says so.
   ══════════════════════════════════════════════════════════════════════════ */

const TYPES = {
  skill:           { label: "Skill",        color: "#D6A241" },
  agent:           { label: "Agent",        color: "#6FA8DC" },
  hook:            { label: "Hook",         color: "#C98BC0" },
  "mcp-tool":      { label: "MCP tool",     color: "#58AE93" },
  "product-skill": { label: "Product data", color: "#B58A6A" },
};

/* The one dataset this site legitimately owns (specs/16 R6): colloquial
   phrasings mapped to artefact names. Data, reviewed in a diff, no model.
   Ukrainian entries are here because R27 requires a Cyrillic query to resolve. */
const ALIASES = [
  { phrase:"layering",              artefact:"onion-architecture",       note:"the backend word for it" },
  { phrase:"шари",                  artefact:"onion-architecture",       note:"uk — layering" },
  { phrase:"архітектура сервера",   artefact:"onion-architecture",       note:"uk — server architecture" },
  { phrase:"скіл для архітектури",  artefact:"onion-architecture",       note:"uk — a skill for architecture" },
  { phrase:"where should this go",  artefact:"frontend-ui-architecture", note:"the question users actually type" },
  { phrase:"де покласти компонент", artefact:"frontend-ui-architecture", note:"uk — where to put a component" },
  { phrase:"bundle size",           artefact:"dependency-checker",       note:"weight question" },
  { phrase:"залежності",            artefact:"dependency-checker",       note:"uk — dependencies" },
  { phrase:"lockfile",              artefact:"repo-conventions",         note:"process, not architecture" },
  { phrase:"написати спеку",        artefact:"spec-creator",             note:"uk — write a spec" },
  { phrase:"what do we know about", artefact:"engineering-insights",     note:"recall mode" },
];

let CAT = null;   /* the fetched catalog */
let A = [];       /* CAT.artefacts, with search fields prepared */

/* ── search ─────────────────────────────────────────────────────────────── */
const norm = s => String(s).toLowerCase().normalize("NFKD");
const tok  = s => norm(s).match(/[\p{L}\p{N}]+/gu) || [];

function prepare(cat) {
  for (const a of cat.artefacts) {
    a.tokName = tok(a.id);
    a.tokDesc = tok(a.description || "");
    a.tokBody = tok(a.summary || "");
    a.trig = extractTriggers(a.description || "");
  }
  return cat.artefacts;
}

/* Heuristic (R24): quoted phrases and "Use for/when/BEFORE" clauses, pulled from
   the real description. Labelled as heuristic wherever shown. */
function extractTriggers(d) {
  const out = [];
  for (const m of d.matchAll(/"([^"]{3,42})"/g)) out.push(m[1]);
  for (const m of d.matchAll(/\bUse (?:for|when|BEFORE|at the START of|AFTER)\b([^.—;]{6,60})/gi))
    out.push(m[0].replace(/\s+/g, " ").trim());
  return [...new Set(out)].slice(0, 4);
}

function score(q, a) {
  const qt = tok(q);
  if (!qt.length) return { s: 0, hits: [] };
  let s = 0; const hits = [];
  const nq = norm(q).trim();
  for (const al of ALIASES)
    if (nq.includes(norm(al.phrase)) && al.artefact === a.id) { s += 120; hits.push(al.phrase); }
  for (const t of qt) {
    if (a.tokName.includes(t)) { s += 30; hits.push(t); continue; }
    if (a.tokName.some(n => n.startsWith(t) && t.length > 2)) { s += 18; hits.push(t); continue; }
    if (a.tokName.some(n => near(n, t))) { s += 10; hits.push(t); continue; }
    const dn = a.tokDesc.filter(w => w === t).length;
    if (dn) { s += 8 + Math.min(dn, 3) * 2; hits.push(t); continue; }
    if (a.tokDesc.some(w => w.startsWith(t) && t.length > 3)) { s += 5; hits.push(t); continue; }
    if (a.tokBody.includes(t)) { s += 2; hits.push(t); }
  }
  return { s, hits: [...new Set(hits)] };
}
function near(a, b) {
  if (Math.abs(a.length - b.length) > 1 || b.length < 4) return false;
  let i = 0, j = 0, d = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++d > 1) return false;
    if (a.length > b.length) i++; else if (a.length < b.length) j++; else { i++; j++; }
  }
  return d + (a.length - i) + (b.length - j) <= 1;
}
function highlight(text, hits, limit) {
  let t = limit && text.length > limit ? text.slice(0, limit).replace(/\s+\S*$/, "") + "…" : text;
  t = t.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
  if (!hits.length) return t;
  const pat = hits.filter(h => h.length > 1).map(esc).sort((x, y) => y.length - x.length).join("|");
  if (!pat) return t;
  try { return t.replace(new RegExp("(" + pat + ")", "giu"), "<mark>$1</mark>"); } catch { return t; }
}
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

/* ── state ──────────────────────────────────────────────────────────────── */
const S = { view:"catalog", q:"", types:new Set(), plugins:new Set(), evalsOnly:false, sel:new Set(), open:null };

function writeHash() {
  const p = new URLSearchParams();
  if (S.view !== "catalog") p.set("v", S.view);
  if (S.q) p.set("q", S.q);
  if (S.types.size) p.set("t", [...S.types].join(","));
  if (S.plugins.size) p.set("p", [...S.plugins].join(","));
  if (S.evalsOnly) p.set("e", "1");
  if (S.sel.size) p.set("b", [...S.sel].join(","));
  if (S.open) p.set("a", S.open);
  history.replaceState(null, "", "#" + p.toString());
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  S.view = p.get("v") || "catalog";
  S.q = p.get("q") || "";
  S.types = new Set((p.get("t") || "").split(",").filter(Boolean));
  S.plugins = new Set((p.get("p") || "").split(",").filter(Boolean));
  S.evalsOnly = p.get("e") === "1";
  S.sel = new Set((p.get("b") || "").split(",").filter(Boolean));
  S.open = p.get("a");
}

const root = document.getElementById("root");
const marketName = () => CAT?.marketplace?.name || null;

/* ── boot ───────────────────────────────────────────────────────────────── */
(async function boot() {
  root.innerHTML = `<div class="state"><h3>Reading the catalog…</h3>
    <p>Generated from the repository at build time by
    <code>scripts/build-catalog.mjs</code>.</p></div>`;
  try {
    const res = await fetch("./catalog.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`catalog.json responded ${res.status}`);
    CAT = await res.json();
    A = prepare(CAT);
  } catch (e) {
    root.innerHTML = `<div class="state">
      <h3>The catalog could not be loaded</h3>
      <p>${escape_(e.message)}. This page holds no data of its own, so there is
         nothing to show without it. Rebuild with
         <code>node scripts/build-catalog.mjs --out prototype/catalog.json</code>,
         or serve through <code>node prototype/dev.mjs</code>, which generates it
         on every request.</p></div>`;
    return;
  }
  readHash();
  render();
})();

/* ── render ─────────────────────────────────────────────────────────────── */
function results() {
  let list = A.map(a => ({ a, ...score(S.q, a) }));
  if (S.q.trim()) list = list.filter(r => r.s > 0).sort((x, y) => y.s - x.s || x.a.id.localeCompare(y.a.id));
  else list = list.map(r => ({ ...r, hits: [] })).sort((x, y) => x.a.id.localeCompare(y.a.id));
  return list;
}
const applyFilters = list => list.filter(({ a }) =>
  (!S.types.size || S.types.has(a.type)) &&
  (!S.plugins.size || S.plugins.has(a.plugin)) &&
  (!S.evalsOnly || (a.evals && a.evals.length)));

function render() {
  writeHash();
  document.querySelectorAll("#nav button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.view === S.view && !S.open ? "page" : "false"));
  if (S.open) { const a = A.find(x => x.id === S.open); return a ? renderDetail(a) : renderMissing(); }
  if (S.view === "graph")      return renderGraph();
  if (S.view === "boundaries") return renderBoundaries();
  if (S.view === "bundle")     return renderBundle();
  renderCatalog();
}

function renderMissing() {
  root.innerHTML = `<div class="state">
    <h3>No artefact named “${escape_(S.open)}”</h3>
    <p>It is not in the generated catalog. Either the link predates a rename, or
       the artefact was removed from the repository — the catalog only ever holds
       what exists right now.</p>
    <button class="btn" data-back>Back to the catalog</button></div>`;
  wire();
}

function renderCatalog() {
  const scored = results();
  const shown = applyFilters(scored);
  const filtersOn = S.types.size || S.plugins.size || S.evalsOnly;
  root.innerHTML = `
  <div class="cols">
    <aside class="rail">${railHTML(scored)}</aside>
    <section>
      <div class="searchrow"><div class="searchbox">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="7" cy="7" r="4.6"></circle><path d="M10.5 10.5L14 14"></path></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
          placeholder="Describe what you need — “I need a skill for layering”" value="${escape_(S.q)}">
      </div></div>
      <p class="hintline"><b>Try:</b>
        ${["layering","де покласти компонент","скіл для архітектури","lockfile","blast radius","architecure"]
          .map(s => `<button class="chip" data-try="${escape_(s)}">${escape_(s)}</button>`).join("")}
      </p>
      ${body()}
    </section>
  </div>`;
  function body() {
    if (!S.q.trim() && !filtersOn) return browseAll(shown);
    if (shown.length) return listHTML(shown, S.q.trim() ? "" : "grouped");
    if (scored.length && filtersOn) return stateFiltersExclude(scored.length);
    return stateZero();
  }
  const q = document.getElementById("q");
  q.addEventListener("input", e => {
    S.q = e.target.value; const p = q.selectionStart; render();
    const n = document.getElementById("q"); n.focus(); n.setSelectionRange(p, p);
  });
  wire();
}

function railHTML(scored) {
  const inType = t => scored.filter(r => r.a.type === t &&
      (!S.plugins.size || S.plugins.has(r.a.plugin)) && (!S.evalsOnly || r.a.evals.length)).length;
  const plugins = [...new Set(A.map(a => a.plugin).filter(Boolean))].sort();
  const withEvals = A.filter(a => a.evals.length).length;

  return `
  <div class="facet"><h3>Type</h3><ul>
    ${Object.entries(TYPES).map(([k, v]) => `
      <li><button class="f ${S.types.has(k) ? "on" : ""}" data-f="type" data-v="${k}">
        <i class="dot" style="background:${v.color}"></i>${v.label}<span class="n">${inType(k)}</span>
      </button></li>`).join("")}
  </ul></div>
  <div class="facet"><h3>Plugin</h3>
    ${plugins.length ? `<ul>${plugins.map(p => `
      <li><button class="f ${S.plugins.has(p) ? "on" : ""}" data-f="plugin" data-v="${escape_(p)}">
        ${escape_(p)}<span class="n">${A.filter(a => a.plugin === p).length}</span></button></li>`).join("")}</ul>`
      : `<p class="railnote">No marketplace manifest in the repository yet, so no
         artefact belongs to a plugin. This facet fills in on its own once
         <code>.claude-plugin/marketplace.json</code> lands.</p>`}
  </div>
  <div class="facet"><h3>Coverage</h3><ul>
    <li><button class="f ${S.evalsOnly ? "on" : ""}" data-f="evals" data-v="1">
      <i class="dot" style="background:var(--ok)"></i>Has evals
      <span class="n">${withEvals}</span></button></li>
  </ul></div>
  ${(S.types.size || S.plugins.size || S.evalsOnly)
    ? `<button class="clearfilters" id="clearf">Clear filters</button>` : ""}`;
}

function diagnosticsHTML() {
  const d = CAT.diagnostics || [];
  if (!d.length) return "";
  return `<details class="diag"><summary>${d.length} generator diagnostic${d.length === 1 ? "" : "s"}
      — what the repository could not answer</summary>
    ${d.map(x => `<div class="drow"><span class="dsev ${x.severity}">${x.severity}</span>
      <div><code>${escape_(x.path)}</code><p>${escape_(x.message)}</p></div></div>`).join("")}
  </details>`;
}

function browseAll(list) {
  const withEvals = A.filter(a => a.evals.length).length;
  let h = `<p class="note"><b>${A.length} artefacts, ${withEvals} with eval coverage.</b>
    Every field below was read from a file in this repository by
    <code>scripts/build-catalog.mjs</code> — nothing on this page is written by hand.
    Each card shows the path its data came from.
    ${marketName() ? "" : `<br><br><b>No marketplace exists yet.</b> Nothing here belongs to a
      plugin and no install command can be produced, so the catalog says so instead
      of naming a plugin that does not exist.`}</p>
    ${diagnosticsHTML()}`;
  for (const [k, v] of Object.entries(TYPES)) {
    const g = list.filter(r => r.a.type === k);
    if (!g.length) continue;
    h += `<div class="groupbar">${v.label} · ${g.length}</div><div class="cards">${g.map(cardHTML).join("")}</div>`;
  }
  return h;
}
function listHTML(list, mode) {
  if (mode === "grouped") return browseAll(list);
  return `<div class="groupbar">${list.length} result${list.length === 1 ? "" : "s"}</div>
          <div class="cards">${list.map(cardHTML).join("")}</div>`;
}

function evalBadge(a) {
  if (!a.evals.length)
    return `<span class="badge ev-none" title="No eval suite covers this yet — a warning, not a failure">no evals</span>`;
  const cases = a.evals.reduce((n, s) => n + (s.cases || 0), 0);
  return `<span class="badge ev-ok" title="${escape_(a.evals.map(s => s.path).join(" · "))}">evals · ${
    cases ? cases + " case" + (cases === 1 ? "" : "s") : a.evals.length + " suite" + (a.evals.length === 1 ? "" : "s")}</span>`;
}

function cardHTML({ a, hits }) {
  const t = TYPES[a.type] || { label: a.type, color: "var(--line)" };
  const canInstall = !!(marketName() && a.plugin);
  return `
  <article class="card ${S.sel.has(a.id) ? "sel" : ""}"
     style="--tc:${t.color};--tcbg:color-mix(in srgb, ${t.color} 15%, transparent)">
    <input class="pick" type="checkbox" data-pick="${escape_(a.id)}" ${S.sel.has(a.id) ? "checked" : ""}
           ${canInstall ? "" : "disabled"} aria-label="Add ${escape_(a.id)} to bundle">
    <h4><button data-open="${escape_(a.id)}">${highlight(a.id, hits)}</button></h4>
    <div class="path">${escape_(a.path)}</div>
    <p class="desc clamp">${highlight(a.description || "", hits, 240)}</p>
    ${a.trig.length ? `<div class="triggers">${a.trig.map(x =>
        `<span class="trig">${highlight(x, hits)}</span>`).join("")}</div>` : ""}
    <div class="side">
      <span class="badge type">${t.label}</span>
      ${a.version ? `<span class="badge ver">v${escape_(a.version)}</span>` : ""}
      ${evalBadge(a)}
      ${a.plugin ? `<span class="plugin">${escape_(a.plugin)}</span>`
                 : `<span class="plugin none">no plugin yet</span>`}
      ${canInstall
        ? `<button class="copy" data-copy="install:${escape_(a.plugin)}">Copy install</button>`
        : `<button class="copy" disabled title="No marketplace manifest exists in the repository yet, so there is no command to copy">Not installable yet</button>`}
    </div>
  </article>`;
}

function stateZero() {
  const nq = norm(S.q);
  const nearest = ALIASES.map(al => ({ al, d: overlap(nq, norm(al.phrase)) }))
    .filter(x => x.d > 0).sort((a, b) => b.d - a.d).slice(0, 3);
  const issue = `https://github.com/${CAT.repo}/issues/new?title=${
    encodeURIComponent("No catalog result for: " + S.q)}&body=${
    encodeURIComponent("Query: " + S.q + "\n\nExpected artefact:\n\nSuggested alias entry for the catalog's alias table:\n")}`;
  return `<div class="state">
    <h3>Nothing matches “${escape_(S.q)}”</h3>
    <p>The catalog searches names, descriptions and a committed alias table. A miss
       usually means the alias table is missing a phrase — a one-line pull request,
       not a bug.</p>
    ${nearest.length ? `<div class="near">${nearest.map(({ al }) => `
      <button data-try="${escape_(al.phrase)}"><span class="k">${escape_(al.phrase)}</span>
        <span>→ ${escape_(al.artefact)} · ${escape_(al.note)}</span></button>`).join("")}</div>` : ""}
    <a class="btn" href="${issue}" target="_blank" rel="noopener">Report the gap</a>
  </div>`;
}
const overlap = (a, b) => { const set = new Set(tok(a)); return tok(b).filter(x => set.has(x)).length; };

function stateFiltersExclude(n) {
  return `<div class="state">
    <h3>Filters exclude all ${n} match${n === 1 ? "" : "es"}</h3>
    <p>The query found results — the active filters removed them. That is a different
       problem from a query that matches nothing, and it has a different fix.</p>
    <button class="btn" id="clearf2">Clear filters, keep the query</button></div>`;
}

/* ── detail ─────────────────────────────────────────────────────────────── */
function renderDetail(a) {
  const t = TYPES[a.type] || { label: a.type, color: "var(--line)" };
  const outgoing = a.mentions || [];
  const incoming = A.filter(x => (x.mentions || []).some(m => m.id === a.id))
    .map(x => ({ from: x, m: x.mentions.find(m => m.id === a.id) }));
  const canInstall = !!(marketName() && a.plugin);

  root.innerHTML = `
  <div class="detail">
    <div class="crumb"><button data-back>← Catalog</button><span>/</span><span>${t.label}</span></div>
    <h1>${escape_(a.id)}</h1>
    <div class="sub">Source: <a href="https://github.com/${CAT.repo}/blob/main/${escape_(a.path)}"
      target="_blank" rel="noopener">${escape_(a.path)}</a></div>
    <div class="detailbar">
      <span class="badge type" style="--tc:${t.color};--tcbg:color-mix(in srgb, ${t.color} 15%, transparent)">${t.label}</span>
      ${a.version ? `<span class="badge ver">v${escape_(a.version)}</span>` : ""}
      ${evalBadge(a)}
      ${canInstall ? `<button class="copy" data-copy="install:${escape_(a.plugin)}">Copy install command</button>`
        : `<button class="copy" disabled>Not installable yet</button>`}
    </div>

    ${!a.plugin ? `<p class="note">${marketName()
      ? `This artefact belongs to <b>no plugin</b> in <code>${escape_(marketName())}</code>. It is
         findable here but cannot be installed until a plugin claims it.`
      : `The repository has <b>no marketplace manifest yet</b>, so nothing is attributable to a
         plugin and no install command exists. This page reports that rather than showing a
         plugin name that would not resolve.`}</p>` : ""}

    ${!a.evals.length ? `<p class="note">No eval suite covers this artefact. That is a
      <b>warning, not a failure</b> — the free quality gate reports it the same way, because
      artefacts predating the harness would otherwise hold the gate red forever.</p>` : ""}

    ${a.descriptionSource === "comment-block" ? `<p class="note">This description was
      <b>derived from the file's leading comment block</b>, not declared. Hooks carry no
      frontmatter, and the catalog will not author text of its own — so it extracts, and
      says that it extracted. A sibling <code>hook.json</code> would make it authoritative.</p>` : ""}

    <div class="sec">Read from source</div>
    <table class="fm"><tbody>
      <tr><th>name</th><td>${escape_(a.id)}</td></tr>
      <tr><th>type</th><td>${escape_(a.type)}</td></tr>
      ${a.version ? `<tr><th>version</th><td>${escape_(a.version)}</td></tr>` : ""}
      ${a.model ? `<tr><th>model</th><td>${escape_(a.model)}</td></tr>` : ""}
      ${a.tools ? `<tr><th>tools</th><td>${escape_(a.tools.join(", "))}</td></tr>` : ""}
      ${a.title ? `<tr><th>title</th><td>${escape_(a.title)}</td></tr>` : ""}
      ${a.wiring?.length ? `<tr><th>wired on</th><td>${a.wiring.map(w =>
        escape_(w.event + (w.matcher ? ` — ${w.matcher}` : ""))).join("<br>")}</td></tr>` : ""}
      <tr><th>plugin</th><td>${a.plugin ? escape_(a.plugin) : "— none yet —"}</td></tr>
      <tr><th>description from</th><td>${escape_(a.descriptionSource || "—")}</td></tr>
      <tr><th>source path</th><td>${escape_(a.path)}</td></tr>
      ${a.evals.length ? `<tr><th>eval suites</th><td>${a.evals.map(s =>
        escape_(s.path + (s.cases ? ` — ${s.cases} case${s.cases === 1 ? "" : "s"}` : ""))).join("<br>")}</td></tr>` : ""}
    </tbody></table>

    <div class="sec">Description · verbatim from source</div>
    <div class="body"><p>${escape_(a.description || "— none —")}</p></div>

    <div class="sec">Trigger phrases · heuristic extraction</div>
    <div class="body">
      ${a.trig.length ? `<div class="triggers" style="margin:0">${a.trig.map(x =>
        `<span class="trig">${escape_(x)}</span>`).join("")}</div>`
        : `<p>Nothing extracted — the description carries no quoted phrase and no “Use for/when” clause.</p>`}
      <p style="margin-top:14px;font-size:12.5px;color:var(--ink-faint)">Extracted by pattern, not by a
        model. The full description above is the authority — read it to see what the extractor missed.</p>
    </div>

    ${a.summary ? `<div class="sec">Opening paragraph</div>
      <div class="body"><p>${escape_(a.summary)}</p></div>` : ""}

    ${outgoing.length ? `<div class="sec">This artefact names</div><div class="pairs">${outgoing.map(m => `
      <div class="pair"><div><h5>${escape_(a.id)}</h5><q>${escape_(m.sentence)}</q>
        <span class="src">${escape_(a.path)}</span></div>
      <div><h5><button class="linkish" data-open="${escape_(m.id)}">${escape_(m.id)}</button></h5>
        <q>${escape_((A.find(x => x.id === m.id) || {}).description?.slice(0, 180) || "")}…</q>
        <span class="src">${escape_((A.find(x => x.id === m.id) || {}).path || "")}</span></div></div>`).join("")}</div>` : ""}

    ${incoming.length ? `<div class="sec">Named by</div><div class="log">${incoming.map(({ from, m }) => `
      <div><time>mentions</time><span><button class="linkish" data-open="${escape_(from.id)}">${escape_(from.id)}</button>
        — “${escape_(m.sentence.slice(0, 110))}${m.sentence.length > 110 ? "…" : ""}”</span>
        <code style="margin-left:auto">${escape_(from.path)}</code></div>`).join("")}</div>` : ""}
  </div>`;
  wire();
}

/* ── boundaries ─────────────────────────────────────────────────────────── */
function renderBoundaries() {
  const pairs = [];
  const seen = new Set();
  for (const a of A) for (const m of a.mentions || []) {
    const other = A.find(x => x.id === m.id);
    if (!other) continue;
    const back = (other.mentions || []).find(x => x.id === a.id);
    const key = [a.id, other.id].sort().join("|");
    if (seen.has(key)) continue;
    seen.add(key);
    pairs.push({ a, other, qa: m.sentence, qb: back ? back.sentence : null, mutual: !!back });
  }
  pairs.sort((x, y) => (y.mutual - x.mutual) || x.a.id.localeCompare(y.a.id));

  root.innerHTML = `<div class="detail">
    <h1>Boundaries</h1>
    <p class="note">Every pair here was found by one artefact <b>naming another inside its own
      description</b>. Each side quotes the sentence it actually wrote, with the file that
      sentence lives in. Nothing is authored by this page, so a boundary that drifts in the
      source drifts here too — visibly. <b>${pairs.filter(p => p.mutual).length}</b> of
      ${pairs.length} pairs are mutual: both sides point at each other.</p>
    <div class="pairs">${pairs.map(p => `
      <div class="pair">
        <div><h5><button class="linkish" data-open="${escape_(p.a.id)}">${escape_(p.a.id)}</button>
          ${p.mutual ? `<span class="badge ev-ok" style="margin-left:8px">mutual</span>` : ""}</h5>
          <q>${escape_(p.qa)}</q><span class="src">${escape_(p.a.path)}</span></div>
        <div><h5><button class="linkish" data-open="${escape_(p.other.id)}">${escape_(p.other.id)}</button></h5>
          ${p.qb ? `<q>${escape_(p.qb)}</q>`
                 : `<q class="dim">Does not name ${escape_(p.a.id)} back — this boundary is stated from one side only.</q>`}
          <span class="src">${escape_(p.other.path)}</span></div>
      </div>`).join("")}</div>
  </div>`;
  wire();
}

/* ── graph ──────────────────────────────────────────────────────────────── */
function renderGraph() {
  const edges = [];
  for (const a of A) for (const m of a.mentions || [])
    if (A.some(x => x.id === m.id)) edges.push({ from: a.id, to: m.id, src: a.path, sentence: m.sentence });

  const ids = [...new Set(edges.flatMap(e => [e.from, e.to]))].sort();
  const colX = { skill: 60, "product-skill": 60, agent: 400, hook: 400, "mcp-tool": 740 };
  const used = {}, pos = {};
  for (const id of ids) {
    const a = A.find(x => x.id === id);
    const x = colX[a.type] ?? 400;
    used[x] = used[x] || 0;
    pos[id] = { x, y: 40 + used[x] * 52, a };
    used[x]++;
  }
  const H = Math.max(...Object.values(pos).map(p => p.y), 120) + 60;

  root.innerHTML = `<div class="detail" style="max-width:none">
    <h1>Relationships</h1>
    <p class="note">${edges.length} edges, every one of them a real mention inside a real
      description. No edge is inferred, so this graph is sparser than the true dependency web —
      and everything it does show can be checked against the file named beside it.</p>
    <div class="graphwrap"><svg viewBox="0 0 900 ${H}" width="100%" height="${H}">
      ${edges.map(e => {
        const f = pos[e.from], t = pos[e.to];
        const mx = (f.x + t.x) / 2;
        return `<path class="gedge" d="M${f.x + 150},${f.y} C${mx + 60},${f.y} ${mx - 60},${t.y} ${t.x},${t.y}"></path>`;
      }).join("")}
      ${Object.entries(pos).map(([id, p]) => `
        <g class="gnode" data-open="${escape_(id)}" style="cursor:pointer">
          <rect x="${p.x}" y="${p.y - 14}" width="150" height="28" rx="6" stroke="${TYPES[p.a.type].color}"></rect>
          <text x="${p.x + 10}" y="${p.y + 4}">${escape_(id.length > 19 ? id.slice(0, 18) + "…" : id)}</text>
        </g>`).join("")}
    </svg></div>
    <div class="legend">${Object.entries(TYPES).map(([k, v]) =>
      `<span><i style="background:${v.color}"></i>${v.label}</span>`).join("")}</div>
    <div class="sec" style="margin-top:26px">Every edge, and the sentence it came from</div>
    <div class="log">${edges.map(e => `<div><time>${escape_(e.from)}</time>
      <span>→ ${escape_(e.to)} — “${escape_(e.sentence.slice(0, 96))}${e.sentence.length > 96 ? "…" : ""}”</span>
      <code style="margin-left:auto">${escape_(e.src)}</code></div>`).join("")}</div>
  </div>`;
  wire();
}

/* ── bundle ─────────────────────────────────────────────────────────────── */
function bundleJSON() {
  const plugins = [...new Set([...S.sel].map(id => (A.find(a => a.id === id) || {}).plugin))].filter(Boolean);
  const enabled = {};
  for (const p of plugins.sort()) enabled[`${p}@${marketName()}`] = true;
  return JSON.stringify({
    extraKnownMarketplaces: { [marketName()]: { source: { source: "github", repo: CAT.repo } } },
    enabledPlugins: enabled,
  }, null, 2);
}

function renderBundle() {
  if (!marketName()) {
    root.innerHTML = `<div class="detail"><h1>Bundle</h1>
      <div class="state"><h3>There is no marketplace to install from yet</h3>
      <p>A settings block needs two things this repository does not have:
         <code>.claude-plugin/marketplace.json</code>, and at least one plugin under
         <code>plugins/</code>. Until both exist, any block shown here would name a
         marketplace that cannot be added and plugins that cannot be installed.</p>
      <p>The catalog is still useful without them — search, boundaries and the graph all
         read from artefacts that do exist.</p>
      <button class="btn" data-back>Back to the catalog</button></div></div>`;
    wire(); return;
  }
  const chosen = [...S.sel].map(id => A.find(a => a.id === id)).filter(Boolean);
  const plugins = [...new Set(chosen.map(a => a.plugin).filter(Boolean))];
  root.innerHTML = `<div class="detail"><h1>Bundle</h1>
    ${!chosen.length ? `<div class="state"><h3>Nothing selected yet</h3>
        <p>Tick artefacts in the catalog and this page assembles the settings block that
           installs them. Plugins are the unit Claude Code enables, so several artefacts
           from one plugin produce one entry, not several.</p>
        <button class="btn" data-back>Go to the catalog</button></div>`
      : `<p class="note">${chosen.length} artefact${chosen.length === 1 ? "" : "s"} resolve to
          <b>${plugins.length} plugin${plugins.length === 1 ? "" : "s"}</b>. Paste this into
          <code>.claude/settings.json</code> and the marketplace is added and the plugins
          enabled on the next session — nobody runs an install command by hand.</p>
        <div class="sec">Selected</div>
        <div class="cards" style="margin-bottom:24px">${chosen.map(a => cardHTML({ a, hits: [] })).join("")}</div>
        <div class="sec">.claude/settings.json</div>
        <pre class="out">${escape_(bundleJSON())}</pre>
        <div class="detailbar" style="margin-top:14px">
          <button class="btn" data-copy="bundle">Copy block</button>
          <button class="btn ghost" id="dl">Download settings.json</button>
          <button class="btn ghost" data-copy="link">Copy shareable link</button>
        </div>`}
  </div>`;
  wire();
}

/* ── events ─────────────────────────────────────────────────────────────── */
function wire() {
  document.querySelectorAll("[data-try]").forEach(b => b.onclick = () => {
    S.q = b.dataset.try; S.view = "catalog"; S.open = null; render(); });
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    S.open = b.dataset.open; window.scrollTo(0, 0); render(); });
  document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => {
    S.open = null; S.view = "catalog"; render(); });
  document.querySelectorAll("button.f").forEach(b => b.onclick = () => {
    const { f, v } = b.dataset;
    if (f === "type") S.types.has(v) ? S.types.delete(v) : S.types.add(v);
    if (f === "plugin") S.plugins.has(v) ? S.plugins.delete(v) : S.plugins.add(v);
    if (f === "evals") S.evalsOnly = !S.evalsOnly;
    render(); });
  const cf = () => { S.types.clear(); S.plugins.clear(); S.evalsOnly = false; render(); };
  for (const id of ["clearf", "clearf2"]) { const el = document.getElementById(id); if (el) el.onclick = cf; }
  document.querySelectorAll("[data-pick]").forEach(cb => cb.onchange = () => {
    cb.checked ? S.sel.add(cb.dataset.pick) : S.sel.delete(cb.dataset.pick);
    render(); syncTray(); });
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b));
  const dl = document.getElementById("dl");
  if (dl) dl.onclick = () => {
    const url = URL.createObjectURL(new Blob([bundleJSON()], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = "settings.json"; a.click();
    URL.revokeObjectURL(url);
    toast("settings.json downloaded");
  };
  syncTray();
}

function copy(b) {
  const [kind, arg] = b.dataset.copy.split(":");
  let text = "";
  if (kind === "install") text = `/plugin marketplace add ${CAT.repo}\n/plugin install ${arg}@${marketName()}`;
  if (kind === "bundle") text = bundleJSON();
  if (kind === "link") text = location.href;
  navigator.clipboard?.writeText(text);
  b.classList.add("done"); const t = b.textContent; b.textContent = "Copied";
  setTimeout(() => { b.classList.remove("done"); b.textContent = t; }, 1300);
  toast(kind === "install" ? "Both commands copied" : "Copied to clipboard");
}

let tt;
function toast(m) {
  const el = document.getElementById("toast");
  el.textContent = m; el.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1800);
}

function syncTray() {
  const tray = document.getElementById("tray");
  tray.classList.toggle("up", S.sel.size > 0 && S.view !== "bundle");
  document.getElementById("trayn").textContent = S.sel.size;
  document.getElementById("traynames").innerHTML =
    [...S.sel].slice(0, 6).map(id => `<span>${escape_(id)}</span>`).join("") +
    (S.sel.size > 6 ? `<span>+${S.sel.size - 6}</span>` : "");
}
document.getElementById("trayclear").onclick = () => { S.sel.clear(); render(); };
document.getElementById("traygo").onclick = () => { S.view = "bundle"; S.open = null; window.scrollTo(0, 0); render(); };
document.getElementById("nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.view = b.dataset.view; S.open = null; window.scrollTo(0, 0); render();
});

/* Theme — dark is the default in every state; the toggle is an explicit stamp. */
const themeBtn = document.getElementById("theme");
const isLight = () => {
  const stamped = document.documentElement.getAttribute("data-theme");
  return stamped === "light" || (!stamped && window.matchMedia("(prefers-color-scheme: light)").matches);
};
function labelTheme() { themeBtn.textContent = isLight() ? "Dark" : "Light"; }
themeBtn.onclick = () => {
  const next = isLight() ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("dd-theme", next); } catch {}
  labelTheme();
};
try { const t = localStorage.getItem("dd-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch {}
labelTheme();

function escape_(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

</script>
</body>
</html>
