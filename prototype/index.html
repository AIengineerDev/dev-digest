<style>
/* Minimal reset. The Artifact runtime supplies one; GitHub Pages does not, so
   it ships with the page. Keep it above the token block so tokens win. */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
img,svg,video{max-width:100%;height:auto}

<title>Artefact Catalog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ─── Tokens ───────────────────────────────────────────────────────────────
   Dark-first by request. The bare :root carries the DARK palette, so the
   un-stamped "system" state and an explicit dark choice both resolve dark.
   Light is opt-in: prefers-color-scheme:light (guarded so an explicit dark
   choice wins) and [data-theme="light"] for the toggle.                    */
:root {
  --bg:        #0F1419;
  --surface:   #161D24;
  --surface-2: #1D262F;
  --surface-3: #253039;
  --line:      #2B3742;
  --line-soft: #212B34;
  --ink:       #E1E7ED;
  --ink-dim:   #96A3B0;
  --ink-faint: #66727E;
  --accent:    #D6A241;
  --accent-2:  #F0BC5C;
  --on-accent: #171104;
  --ok:        #58AE93;
  --note:      #7E8C9B;
  --crit:      #D2685C;
  --mark:      #4A3A16;
  --mark-ink:  #F4CE7C;
  --shadow:    0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #EEF1F3;
    --surface:   #FFFFFF;
    --surface-2: #E6EAEE;
    --surface-3: #DCE2E7;
    --line:      #CCD4DA;
    --line-soft: #DFE5EA;
    --ink:       #141C24;
    --ink-dim:   #4F5D6A;
    --ink-faint: #75828E;
    --accent:    #8A5D0C;
    --accent-2:  #6E4A08;
    --on-accent: #FFF8EA;
    --ok:        #2F7460;
    --note:      #5C6975;
    --crit:      #A63C30;
    --mark:      #F6E3B4;
    --mark-ink:  #4A3405;
    --shadow:    0 1px 0 rgba(255,255,255,.6), 0 6px 18px rgba(20,28,36,.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:        #EEF1F3;
  --surface:   #FFFFFF;
  --surface-2: #E6EAEE;
  --surface-3: #DCE2E7;
  --line:      #CCD4DA;
  --line-soft: #DFE5EA;
  --ink:       #141C24;
  --ink-dim:   #4F5D6A;
  --ink-faint: #75828E;
  --accent:    #8A5D0C;
  --accent-2:  #6E4A08;
  --on-accent: #FFF8EA;
  --ok:        #2F7460;
  --note:      #5C6975;
  --crit:      #A63C30;
  --mark:      #F6E3B4;
  --mark-ink:  #4A3405;
  --shadow:    0 1px 0 rgba(255,255,255,.6), 0 6px 18px rgba(20,28,36,.10);
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 Archivo, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
code, .mono, .path { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ─── App shell ─────────────────────────────────────────────────────────── */
.top {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 20px;
  padding: 0 20px; height: 56px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 9px; margin-right: 4px; }
.brand b { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.brand span {
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
  color: var(--ink-faint); text-transform: uppercase; letter-spacing: .09em;
}
.nav { display: flex; gap: 2px; }
.nav button {
  background: none; border: 0; padding: 7px 12px; border-radius: 6px;
  color: var(--ink-dim); font-size: 13.5px; font-weight: 500;
}
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--surface-3); color: var(--ink); }
.top .spacer { flex: 1; }
.iconbtn {
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 11px; font-size: 12.5px; color: var(--ink-dim);
}
.iconbtn:hover { color: var(--ink); border-color: var(--ink-faint); }

.wrap { max-width: 1240px; margin: 0 auto; padding: 22px 20px 120px; }
.cols { display: grid; grid-template-columns: 216px minmax(0,1fr); gap: 26px; align-items: start; }
@media (max-width: 880px) { .cols { grid-template-columns: 1fr; } .rail { order: 2; } }

/* ─── Search ────────────────────────────────────────────────────────────── */
.searchrow { display: flex; gap: 10px; margin-bottom: 6px; }
.searchbox { position: relative; flex: 1; }
.searchbox input {
  width: 100%; padding: 13px 15px 13px 40px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
  font-size: 15.5px;
}
.searchbox input::placeholder { color: var(--ink-faint); }
.searchbox input:focus { border-color: var(--accent); outline: none; }
.searchbox svg { position: absolute; left: 14px; top: 15px; opacity: .5; }
.hintline {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  margin: 0 0 22px; font-size: 12.5px; color: var(--ink-faint);
}
.hintline b { font-weight: 500; color: var(--ink-dim); }
.chip {
  background: var(--surface-2); border: 1px solid var(--line-soft);
  border-radius: 20px; padding: 3px 10px; font-size: 12px; color: var(--ink-dim);
  font-family: "IBM Plex Mono", monospace;
}
.chip:hover { border-color: var(--accent); color: var(--ink); }

/* ─── Facet rail ────────────────────────────────────────────────────────── */
.rail { position: sticky; top: 78px; display: flex; flex-direction: column; gap: 22px; }
.facet h3 {
  margin: 0 0 9px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-faint);
  font-family: "IBM Plex Mono", monospace;
}
.facet ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.facet li button {
  width: 100%; display: flex; align-items: center; gap: 8px;
  background: none; border: 0; padding: 5px 8px; border-radius: 5px;
  font-size: 13.5px; color: var(--ink-dim); text-align: left;
}
.facet li button:hover { background: var(--surface-2); color: var(--ink); }
.facet li button.on { background: var(--surface-3); color: var(--ink); font-weight: 500; }
.facet .dot { width: 7px; height: 7px; border-radius: 2px; flex: 0 0 auto; }
.facet .n {
  margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
  color: var(--ink-faint); font-variant-numeric: tabular-nums;
}
.clearfilters {
  background: none; border: 1px dashed var(--line); border-radius: 6px;
  padding: 6px; font-size: 12px; color: var(--ink-dim); width: 100%;
}
.clearfilters:hover { border-color: var(--crit); color: var(--crit); border-style: solid; }

/* ─── Cards ─────────────────────────────────────────────────────────────── */
.groupbar {
  display: flex; align-items: center; gap: 10px; margin: 26px 0 12px;
  font-family: "IBM Plex Mono", monospace; font-size: 11px;
  letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint);
}
.groupbar::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
.groupbar:first-child { margin-top: 4px; }

.cards { display: flex; flex-direction: column; gap: 9px; }
.card {
  position: relative; display: grid;
  grid-template-columns: 22px minmax(0,1fr) auto; gap: 0 13px;
  padding: 14px 15px; background: var(--surface);
  border: 1px solid var(--line-soft); border-radius: 9px;
  border-left: 3px solid var(--tc, var(--line));
  transition: border-color .12s, background .12s;
}
.card:hover { border-color: var(--line); border-left-color: var(--tc); background: var(--surface-2); }
.card.sel { border-color: var(--accent); }
.card .pick {
  grid-row: 1 / span 3; align-self: start; margin-top: 2px;
  width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer;
}
.card h4 { margin: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -.005em; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.card h4 button {
  background: none; border: 0; padding: 0; font: inherit; color: var(--ink);
  text-align: left; text-decoration-color: transparent;
}
.card h4 button:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.card .path {
  grid-column: 2; font-size: 11.5px; color: var(--ink-faint);
  margin: 3px 0 7px; word-break: break-all;
}
.card .desc { grid-column: 2; margin: 0; font-size: 13.5px; color: var(--ink-dim); line-height: 1.5; }
.card .desc.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .triggers { grid-column: 2; display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.trig {
  font-family: "IBM Plex Mono", monospace; font-size: 11px;
  background: var(--surface-3); color: var(--ink-dim);
  padding: 2px 7px; border-radius: 4px;
}
.card .side { grid-column: 3; grid-row: 1 / span 4; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }

.badge {
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 500;
  letter-spacing: .05em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 4px; white-space: nowrap;
}
.badge.type { background: var(--tcbg); color: var(--tc); }
.badge.ver { background: var(--surface-3); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.badge.ev-ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.badge.ev-none { background: var(--surface-3); color: var(--note); }
.plugin { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-faint); }
.copy {
  background: var(--surface-3); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 10px; font-size: 12px; color: var(--ink-dim); white-space: nowrap;
}
.copy:hover { border-color: var(--accent); color: var(--accent); }
.copy.done { border-color: var(--ok); color: var(--ok); }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }

/* ─── Empty / zero states ───────────────────────────────────────────────── */
.state {
  border: 1px dashed var(--line); border-radius: 11px; padding: 34px 30px;
  background: var(--surface); text-align: left;
}
.state h3 { margin: 0 0 9px; font-size: 18px; font-weight: 600; }
.state p { margin: 0 0 16px; color: var(--ink-dim); font-size: 14px; max-width: 62ch; }
.state .near { display: flex; flex-direction: column; gap: 7px; margin: 0 0 18px; }
.state .near button {
  display: flex; gap: 10px; align-items: baseline; text-align: left;
  background: var(--surface-2); border: 1px solid var(--line-soft);
  border-radius: 7px; padding: 9px 12px; font-size: 13px; color: var(--ink-dim);
}
.state .near button:hover { border-color: var(--accent); color: var(--ink); }
.state .near .k { font-family: "IBM Plex Mono", monospace; color: var(--accent); font-size: 12.5px; }
.btn {
  background: var(--accent); color: var(--on-accent); border: 0;
  border-radius: 7px; padding: 9px 15px; font-size: 13.5px; font-weight: 600;
}
.btn:hover { background: var(--accent-2); }
.btn.ghost { background: none; color: var(--ink-dim); border: 1px solid var(--line); font-weight: 500; }
.btn.ghost:hover { color: var(--ink); border-color: var(--ink-faint); }

/* ─── Detail ────────────────────────────────────────────────────────────── */
.detail { max-width: 860px; }
.crumb {
  display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
  font-size: 13px; color: var(--ink-faint);
}
.crumb button { background: none; border: 0; color: var(--ink-dim); padding: 0; font-size: 13px; }
.crumb button:hover { color: var(--accent); }
.detail h1 { margin: 0 0 5px; font-size: 30px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.detail .sub { font-size: 12.5px; color: var(--ink-faint); margin-bottom: 18px; word-break: break-all; }
.detail .sub a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.detailbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.fm {
  width: 100%; border-collapse: collapse; margin: 0 0 26px;
  font-size: 13.5px; background: var(--surface);
  border: 1px solid var(--line-soft); border-radius: 9px; overflow: hidden;
}
.fm th, .fm td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.fm tr:last-child th, .fm tr:last-child td { border-bottom: 0; }
.fm th {
  width: 190px; font-weight: 500; color: var(--ink-faint);
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
}
.fm td { color: var(--ink); font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
.sec { margin: 0 0 12px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; }
.body {
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: 9px; padding: 18px 20px; margin-bottom: 26px;
  font-size: 14px; line-height: 1.62; color: var(--ink-dim); max-width: 68ch;
}
.body p { margin: 0 0 12px; }
.body p:last-child { margin: 0; }
.pairs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
.pair {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  border: 1px solid var(--line-soft); border-radius: 9px; overflow: hidden; background: var(--surface);
}
@media (max-width: 700px) { .pair { grid-template-columns: 1fr; } }
.pair > div { padding: 14px 16px; }
.pair > div + div { border-left: 1px solid var(--line-soft); }
@media (max-width: 700px) { .pair > div + div { border-left: 0; border-top: 1px solid var(--line-soft); } }
.pair h5 { margin: 0 0 7px; font-size: 14px; font-weight: 600; font-family: "IBM Plex Mono", monospace; }
.pair q { font-size: 13px; color: var(--ink-dim); font-style: normal; line-height: 1.5; }
.pair .src { display: block; margin-top: 9px; font-size: 11px; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; }
.log { display: flex; flex-direction: column; gap: 0; margin-bottom: 26px; }
.log div {
  display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line-soft);
  font-size: 13px; color: var(--ink-dim);
}
.log time { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); flex: 0 0 88px; font-variant-numeric: tabular-nums; }
.log code { font-size: 12px; color: var(--ink-faint); }

/* ─── Bundle tray ───────────────────────────────────────────────────────── */
.tray {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: var(--surface); border-top: 1px solid var(--line);
  box-shadow: 0 -8px 28px rgba(0,0,0,.28);
  transform: translateY(100%); transition: transform .18s ease;
}
.tray.up { transform: translateY(0); }
.trayin { max-width: 1240px; margin: 0 auto; padding: 13px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.trayin .cnt { font-size: 13.5px; color: var(--ink-dim); }
.trayin .cnt b { color: var(--ink); font-variant-numeric: tabular-nums; }
.trayin .names { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; min-width: 120px; }
.trayin .names span {
  font-family: "IBM Plex Mono", monospace; font-size: 11px;
  background: var(--surface-3); color: var(--ink-dim); padding: 2px 7px; border-radius: 4px;
}
pre.out {
  margin: 0; padding: 16px 18px; background: var(--surface-2);
  border: 1px solid var(--line-soft); border-radius: 9px;
  font-family: "IBM Plex Mono", monospace; font-size: 12.5px; line-height: 1.6;
  color: var(--ink); overflow-x: auto;
}
pre.out .k { color: var(--accent); }
pre.out .s { color: var(--ok); }

/* ─── Graph ─────────────────────────────────────────────────────────────── */
.graphwrap { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 11px; padding: 8px; overflow-x: auto; }
.graphwrap svg { display: block; min-width: 640px; }
.gnode text { font-family: "IBM Plex Mono", monospace; font-size: 11px; fill: var(--ink); }
.gnode rect { fill: var(--surface-2); stroke: var(--line); }
.gnode:hover rect { stroke: var(--accent); }
.gedge { stroke: var(--line); stroke-width: 1.25; fill: none; }
.gedge.hi { stroke: var(--accent); stroke-width: 2; }
.elabel { font-family: "IBM Plex Mono", monospace; font-size: 9.5px; fill: var(--ink-faint); }

.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 14px 0 0; font-size: 12px; color: var(--ink-faint); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: block; }

.note {
  border-left: 2px solid var(--accent); background: var(--surface);
  padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 0 0 24px;
  font-size: 13px; color: var(--ink-dim); max-width: 76ch;
}
.note b { color: var(--ink); font-weight: 600; }
.toast {
  position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%) translateY(14px);
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 7px;
  font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all .16s; z-index: 60;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.h { display: none; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Artefact Catalog</b><span>dev-digest</span></div>
  <nav class="nav" id="nav">
    <button data-view="catalog" aria-current="page">Catalog</button>
    <button data-view="graph">Graph</button>
    <button data-view="boundaries">Boundaries</button>
    <button data-view="bundle">Bundle</button>
  </nav>
  <div class="spacer"></div>
  <button class="iconbtn" id="theme">Light</button>
</header>

<main class="wrap" id="root"></main>

<div class="tray" id="tray"><div class="trayin">
  <span class="cnt"><b id="trayn">0</b> selected</span>
  <div class="names" id="traynames"></div>
  <button class="btn ghost" id="trayclear">Clear</button>
  <button class="btn" id="traygo">Build settings.json</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   DATA — every name, description, version, model, tool list and source path
   below is read from the real repository. In production this whole object is
   the build-time generator's output (spec 16, R1) and is never hand-authored
   inside site/ (R3). Eval coverage is real: 4 of 22 artefacts have cases.
   ══════════════════════════════════════════════════════════════════════════ */
const REPO = "AIengineerDev/dev-digest";
const MARKET = "devdigest-tools";

const TYPES = {
  skill:     { label: "Skill",       color: "#D6A241", plugin: "devdigest-skills" },
  agent:     { label: "Agent",       color: "#6FA8DC", plugin: "devdigest-agents" },
  hook:      { label: "Hook",        color: "#C98BC0", plugin: "devdigest-agents" },
  "mcp-tool":{ label: "MCP tool",    color: "#58AE93", plugin: "devdigest-mcp"    },
  product:   { label: "Product data",color: "#B58A6A", plugin: "devdigest-skills" },
};

const A = [

/* ══════════════════════════════════════════════════════════════════════════

   the index and the query MUST normalize identically or every Cyrillic query

const norm = s => s.toLowerCase().normalize("NFKD");
const tok  = s => norm(s).match(/[\p{L}\p{N}]+/gu) || [];

/* Heuristic trigger extraction (R24) — quoted phrases plus "Use for/when/BEFORE"
   clauses. Labelled as heuristic wherever it is shown. */
function extractTriggers(d) {
  const out = [];
  for (const m of d.matchAll(/"([^"]{3,42})"/g)) out.push(m[1]);
  for (const m of d.matchAll(/\bUse (?:for|when|BEFORE|at the START of|AFTER)\b([^.—;]{6,60})/gi))
    out.push(m[0].replace(/\s+/g, " ").trim());
  return [...new Set(out)].slice(0, 4);
}

function score(q, a) {
  const qt = tok(q);
  if (!qt.length) return { s: 0, hits: [] };
  let s = 0; const hits = [];
  const nq = norm(q).trim();

  for (const al of ALIASES) {
    if (nq.includes(norm(al.phrase)) && al.artefact === a.id) { s += 120; hits.push(al.phrase); }
  }
  for (const t of qt) {
    if (a.tokName.includes(t)) { s += 30; hits.push(t); continue; }
    if (a.tokName.some(n => n.startsWith(t) && t.length > 2)) { s += 18; hits.push(t); continue; }
    if (a.tokName.some(n => near(n, t))) { s += 10; hits.push(t); continue; }
    const dn = a.tokDesc.filter(w => w === t).length;
    if (dn) { s += 8 + Math.min(dn, 3) * 2; hits.push(t); continue; }
    if (a.tokDesc.some(w => w.startsWith(t) && t.length > 3)) { s += 5; hits.push(t); continue; }
    if (a.tokBody.includes(t)) { s += 2; hits.push(t); }
  }
  return { s, hits: [...new Set(hits)] };
}
/* one-edit distance, enough for a typo; cheap on a 22-row index */
function near(a, b) {
  if (Math.abs(a.length - b.length) > 1 || b.length < 4) return false;
  let i = 0, j = 0, d = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++d > 1) return false;
    if (a.length > b.length) i++; else if (a.length < b.length) j++; else { i++; j++; }
  }
  return d + (a.length - i) + (b.length - j) <= 1;
}

function highlight(text, hits, limit) {
  let t = limit && text.length > limit ? text.slice(0, limit).replace(/\s+\S*$/, "") + "…" : text;
  t = t.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));

    b.setAttribute("aria-current", b.dataset.view === S.view && !S.open ? "page" : "false"));

  if (S.open) return renderDetail(A.find(a => a.id === S.open));
  if (S.view === "graph")      return renderGraph();
  if (S.view === "boundaries") return renderBoundaries();
  if (S.view === "bundle")     return renderBundle();
  renderCatalog();
}

function renderCatalog() {
  const scored = results();
  const shown = applyFilters(scored);
  const filtersOn = S.types.size || S.plugins.size || S.evalsOnly;

  root.innerHTML = `
  <div class="cols">
    <aside class="rail">${railHTML(scored)}</aside>
    <section>
      <div class="searchrow"><div class="searchbox">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="7" cy="7" r="4.6"></circle><path d="M10.5 10.5L14 14"></path></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
          placeholder="Describe what you need — “I need a skill for layering”" value="${attr(S.q)}">
      </div></div>
      <p class="hintline"><b>Try:</b>
        ${["layering","де покласти компонент","скіл для архітектури","lockfile","blast radius","architecure"]
          .map(s => `<button class="chip" data-try="${attr(s)}">${escape_(s)}</button>`).join("")}
      </p>
      ${body()}
    </section>
  </div>`;

  function body() {
    if (!S.q.trim() && !filtersOn) return browseAll(shown);
    if (shown.length) return listHTML(shown, S.q.trim() ? "" : "grouped");
    if (scored.length && filtersOn) return stateFiltersExclude(scored.length);
    return stateZero();
  }

  const q = document.getElementById("q");
  q.addEventListener("input", e => { S.q = e.target.value; const p = q.selectionStart; render();
    const n = document.getElementById("q"); n.focus(); n.setSelectionRange(p, p); });
  wire();
}

function railHTML(scored) {
  const inType = t => scored.filter(r => r.a.type === t &&
      (!S.plugins.size || S.plugins.has(r.a.plugin)) && (!S.evalsOnly || r.a.evals)).length;
  const inPlug = p => scored.filter(r => r.a.plugin === p &&
      (!S.types.size || S.types.has(r.a.type)) && (!S.evalsOnly || r.a.evals)).length;
  const plugins = [...new Set(A.map(a => a.plugin))].sort();

  return `
  <div class="facet"><h3>Type</h3><ul>
    ${Object.entries(TYPES).map(([k, v]) => `
      <li><button class="f ${S.types.has(k) ? "on" : ""}" data-f="type" data-v="${k}">
        <i class="dot" style="background:${v.color}"></i>${v.label}<span class="n">${inType(k)}</span>
      </button></li>`).join("")}
  </ul></div>
  <div class="facet"><h3>Plugin</h3><ul>
    ${plugins.map(p => `
      <li><button class="f ${S.plugins.has(p) ? "on" : ""}" data-f="plugin" data-v="${p}">
        ${p.replace("devdigest-", "")}<span class="n">${inPlug(p)}</span>
      </button></li>`).join("")}
  </ul></div>
  <div class="facet"><h3>Coverage</h3><ul>
    <li><button class="f ${S.evalsOnly ? "on" : ""}" data-f="evals" data-v="1">
      <i class="dot" style="background:var(--ok)"></i>Has evals
      <span class="n">${A.filter(a => a.evals).length}</span></button></li>
  </ul></div>
  ${(S.types.size || S.plugins.size || S.evalsOnly)
    ? `<button class="clearfilters" id="clearf">Clear filters</button>` : ""}`;
}

function browseAll(list) {
  let h = `<p class="note"><b>22 artefacts, ${A.filter(a => a.evals).length} with eval coverage.</b>
    Everything below is generated from the repository at build time — no description,
    version or tool list is authored in this site. Each card shows the file it came from.</p>`;
  for (const [k, v] of Object.entries(TYPES)) {
    const g = list.filter(r => r.a.type === k);
    if (!g.length) continue;
    h += `<div class="groupbar">${v.label} · ${g.length}</div><div class="cards">${g.map(cardHTML).join("")}</div>`;
  }
  return h;
}

function listHTML(list, mode) {
  if (mode === "grouped") return browseAll(list);
  return `<div class="groupbar">${list.length} result${list.length === 1 ? "" : "s"}</div>
          <div class="cards">${list.map(cardHTML).join("")}</div>`;
}

function cardHTML({ a, hits }) {
  const t = TYPES[a.type];
  const ev = a.evals
    ? `<span class="badge ev-ok" title="${a.evals.where}">evals · ${a.evals.cases}</span>`
    : `<span class="badge ev-none" title="No eval cases yet — a warning, not a failure">no evals</span>`;
  return `
  <article class="card ${S.sel.has(a.id) ? "sel" : ""}"
     style="--tc:${t.color};--tcbg:color-mix(in srgb, ${t.color} 15%, transparent)">
    <input class="pick" type="checkbox" data-pick="${a.id}" ${S.sel.has(a.id) ? "checked" : ""}
           aria-label="Add ${a.id} to bundle">
    <h4><button data-open="${a.id}">${highlight(a.id, hits)}</button></h4>
    <div class="path">${escape_(a.path)}</div>
    <p class="desc clamp">${highlight(a.desc, hits, 240)}</p>
    ${a.trig.length ? `<div class="triggers">${a.trig.map(x =>
        `<span class="trig">${highlight(x, hits)}</span>`).join("")}</div>` : ""}
    <div class="side">
      <span class="badge type">${t.label}</span>
      ${a.version ? `<span class="badge ver">v${a.version}</span>` : ""}
      ${ev}
      <span class="plugin">${a.plugin}</span>
      <button class="copy" data-copy="install:${a.plugin}">Copy install</button>
    </div>
  </article>`;
}

function stateZero() {
  const nq = norm(S.q);
  const nearest = ALIASES
    .map(al => ({ al, d: overlap(nq, norm(al.phrase)) }))
    .filter(x => x.d > 0).sort((a, b) => b.d - a.d).slice(0, 3);
  const issue = `https://github.com/${REPO}/issues/new?title=${encodeURIComponent("No catalog result for: " + S.q)}&body=${encodeURIComponent("Query: " + S.q + "\n\nExpected artefact:\n\nSuggested alias entry for site/aliases.json:\n")}`;
  return `<div class="state">
    <h3>Nothing matches “${escape_(S.q)}”</h3>
    <p>The catalog searches names, descriptions and a committed alias table. A miss usually
       means the alias table is missing a phrase — which is a one-line pull request, not a bug.</p>
    ${nearest.length ? `<div class="near">${nearest.map(({ al }) => `
      <button data-try="${attr(al.phrase)}"><span class="k">${escape_(al.phrase)}</span>
        <span>→ ${escape_(al.artefact)} · ${escape_(al.note)}</span></button>`).join("")}</div>` : ""}
    <a class="btn" href="${issue}" target="_blank" rel="noopener">Report the gap</a>
  </div>`;
}
function overlap(a, b) { const A_ = new Set(tok(a)), B = tok(b); return B.filter(x => A_.has(x)).length; }

function stateFiltersExclude(n) {
  return `<div class="state">
    <h3>Filters exclude all ${n} match${n === 1 ? "" : "es"}</h3>
    <p>The query found results — the active filters removed them. This is a different problem
       from a query that matches nothing, and it has a different fix.</p>
    <button class="btn" id="clearf2">Clear filters, keep the query</button>
  </div>`;
}

function renderDetail(a) {
  const t = TYPES[a.type];
  const pairs = PAIRS.filter(p => p.a === a.id || p.b === a.id);
  const edges = EDGES.filter(e => e.from === a.id || e.to === a.id);
  root.innerHTML = `
  <div class="detail">
    <div class="crumb"><button data-back>← Catalog</button><span>/</span><span>${t.label}</span></div>
    <h1>${escape_(a.id)}</h1>
    <div class="sub">Source: <a href="https://github.com/${REPO}/blob/main/${a.path}" target="_blank"
      rel="noopener">${escape_(a.path)}</a></div>
    <div class="detailbar">
      <span class="badge type" style="--tc:${t.color};--tcbg:color-mix(in srgb, ${t.color} 15%, transparent)">${t.label}</span>
      ${a.version ? `<span class="badge ver">v${a.version}</span>` : ""}
      ${a.evals ? `<span class="badge ev-ok">evals · ${a.evals.cases} · baseline ${a.evals.at}</span>`
                : `<span class="badge ev-none">no eval cases</span>`}
      <button class="copy" data-copy="install:${a.plugin}">Copy install command</button>
      <button class="copy" data-copy="raw:${a.id}">Copy raw</button>
    </div>

    ${!a.evals ? `<p class="note">No eval cases cover this artefact yet. That is a
      <b>warning, not a failure</b> — the free quality gate reports it the same way, because
      artefacts that predate the harness would otherwise hold the gate red forever.</p>` : ""}
    ${a.needsDesc ? `<p class="note">This hook has <b>no machine-readable description in its
      source</b>. The text above is the one place in the catalog that would have to be authored
      by hand — which the governing principle forbids. The source must gain a description
      before this artefact can ship.</p>` : ""}

    <div class="sec">Frontmatter</div>
    <table class="fm"><tbody>
      <tr><th>name</th><td>${escape_(a.id)}</td></tr>
      ${a.version ? `<tr><th>version</th><td>${a.version}</td></tr>` : ""}
      ${a.model ? `<tr><th>model</th><td>${a.model}</td></tr>` : ""}
      ${a.tools ? `<tr><th>tools</th><td>${escape_(a.tools)}</td></tr>` : ""}
      <tr><th>owning plugin</th><td>${a.plugin}</td></tr>
      <tr><th>source path</th><td>${escape_(a.path)}</td></tr>
    </tbody></table>

    <div class="sec">Description (verbatim from source)</div>
    <div class="body"><p>${escape_(a.desc)}</p></div>

    <div class="sec">Trigger phrases · heuristic extraction</div>
    <div class="body">
      ${a.trig.length ? `<div class="triggers" style="margin:0">${a.trig.map(x =>
        `<span class="trig">${escape_(x)}</span>`).join("")}</div>`
        : `<p>Nothing extracted. The description carries no quoted phrase and no “Use for/when” clause.</p>`}
      <p style="margin-top:14px;font-size:12.5px;color:var(--ink-faint)">Extracted by pattern, not by a model.
      The full description above is the authority — read it to see what the extractor missed.</p>
    </div>

    <div class="sec">Body</div>
    <div class="body"><p>${escape_(a.body)}</p></div>

    ${pairs.length ? `<div class="sec">Easily confused with</div><div class="pairs">${pairs.map(p => {
      const other = p.a === a.id ? p.b : p.a;
      const mine = p.a === a.id ? p.qa : p.qb, theirs = p.a === a.id ? p.qb : p.qa;
      return `<div class="pair">
        <div><h5>${escape_(a.id)}</h5><q>${escape_(mine)}</q>
          <span class="src">${escape_(a.path)}</span></div>
        <div><h5><button style="background:none;border:0;padding:0;font:inherit;color:var(--accent)"
          data-open="${other}">${escape_(other)}</button></h5><q>${escape_(theirs)}</q>
          <span class="src">${escape_((A.find(x => x.id === other) || {}).path || "")}</span></div>
      </div>`; }).join("")}</div>` : ""}

    ${edges.length ? `<div class="sec">Relationships</div><div class="log">${edges.map(e => `
      <div><time>${escape_(e.why)}</time>
        <span>${escape_(e.from === a.id ? "→ " + e.to : "← " + e.from)}</span>
        <code style="margin-left:auto">${escape_(e.src)}</code></div>`).join("")}</div>` : ""}

    <div class="sec">Changelog · from git history</div>
    <div class="log">${a.log.map(([d, m]) => `<div><time>${d}</time><span>${escape_(m)}</span></div>`).join("")}</div>
  </div>`;
  wire();
}

function renderBoundaries() {
  root.innerHTML = `<div class="detail">
    <h1>Boundaries</h1>
    <p class="note">These artefacts deliberately delimit each other. Each side quotes
      <b>its own description</b> — nothing here is written by the site, so a boundary that
      drifts in the source drifts here too, visibly.</p>
    <div class="pairs">${PAIRS.map(p => {
      const A_ = A.find(x => x.id === p.a), B = A.find(x => x.id === p.b);
      return `<div class="pair">
        <div><h5><button style="background:none;border:0;padding:0;font:inherit;color:var(--accent)"
          data-open="${p.a}">${p.a}</button></h5><q>${escape_(p.qa)}</q>
          <span class="src">${escape_(A_.path)}</span></div>
        <div><h5><button style="background:none;border:0;padding:0;font:inherit;color:var(--accent)"
          data-open="${p.b}">${p.b}</button></h5><q>${escape_(p.qb)}</q>
          <span class="src">${escape_(B.path)}</span></div>
      </div>`; }).join("")}</div>
  </div>`;
  wire();
}

function renderGraph() {
  const ids = [...new Set(EDGES.flatMap(e => [e.from, e.to]))];
  const cols = { skill: 90, agent: 400, hook: 400, "mcp-tool": 700, product: 700 };
  const byCol = {};
  const pos = {};
  ids.forEach(id => {
    const a = A.find(x => x.id === id); const c = cols[a.type];
    byCol[c] = (byCol[c] || 0); pos[id] = { x: c, y: 44 + byCol[c] * 56, a }; byCol[c]++;
  });
  const W = 900, H = Math.max(...Object.values(pos).map(p => p.y)) + 70;

  root.innerHTML = `<div class="detail" style="max-width:none">
    <h1>Relationships</h1>
    <p class="note">Every edge is drawn <b>only</b> from a cross-reference that already exists
      in a source file, and carries the path and line it was read from. An edge with no citation
      is not drawn — which is why this graph is sparser than the real dependency web.</p>
    <div class="graphwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
      ${EDGES.map((e, i) => {
        const f = pos[e.from], t = pos[e.to];
        const mx = (f.x + t.x) / 2;
        return `<path class="gedge" id="e${i}" d="M${f.x + 150},${f.y} C${mx + 60},${f.y} ${mx - 60},${t.y} ${t.x},${t.y}"></path>
          <text class="elabel" x="${mx + 6}" y="${(f.y + t.y) / 2 - 5}" text-anchor="middle">${e.why}</text>`;
      }).join("")}
      ${Object.entries(pos).map(([id, p]) => `
        <g class="gnode" data-open="${id}" style="cursor:pointer">
          <rect x="${p.x}" y="${p.y - 15}" width="150" height="30" rx="6"
                stroke="${TYPES[p.a.type].color}"></rect>
          <text x="${p.x + 10}" y="${p.y + 4}">${id.length > 19 ? id.slice(0, 18) + "…" : id}</text>
        </g>`).join("")}
    </svg></div>
    <div class="legend">${Object.entries(TYPES).map(([k, v]) =>
      `<span><i style="background:${v.color}"></i>${v.label}</span>`).join("")}</div>
    <div class="sec" style="margin-top:26px">Edge sources</div>
    <div class="log">${EDGES.map(e => `<div><time>${e.why}</time>
      <span>${e.from} → ${e.to}</span><code style="margin-left:auto">${escape_(e.src)}</code></div>`).join("")}</div>
  </div>`;
  wire();
}

function bundleJSON() {
  const plugins = [...new Set([...S.sel].map(id => (A.find(a => a.id === id) || {}).plugin))].filter(Boolean);
  const enabled = {};
  plugins.forEach(p => enabled[p + "@" + MARKET] = true);
  return JSON.stringify({
    extraKnownMarketplaces: { [MARKET]: { source: { source: "github", repo: REPO } } },
    enabledPlugins: enabled
  }, null, 2);
}

function renderBundle() {
  const chosen = [...S.sel].map(id => A.find(a => a.id === id)).filter(Boolean);
  const plugins = [...new Set(chosen.map(a => a.plugin))];
  root.innerHTML = `<div class="detail">
    <h1>Bundle</h1>
    ${!chosen.length ? `<div class="state">
        <h3>Nothing selected yet</h3>
        <p>Tick artefacts in the catalog and this page assembles the settings block that
           installs them. Plugins are the unit Claude Code enables, so selecting several
           artefacts from one plugin produces one entry, not several.</p>
        <button class="btn" data-back>Go to the catalog</button></div>`
      : `<p class="note">${chosen.length} artefact${chosen.length === 1 ? "" : "s"} resolve to
          <b>${plugins.length} plugin${plugins.length === 1 ? "" : "s"}</b>.
          Paste this into <code>.claude/settings.json</code> and the marketplace is added and
          the plugins enabled on the next session — nobody runs an install command by hand.</p>
        <div class="sec">Selected</div>
        <div class="cards" style="margin-bottom:24px">${chosen.map(a =>
          cardHTML({ a, hits: [] })).join("")}</div>
        <div class="sec">.claude/settings.json</div>
        <pre class="out">${escape_(bundleJSON())}</pre>
        <div class="detailbar" style="margin-top:14px">
          <button class="btn" data-copy="bundle">Copy block</button>
          <button class="btn ghost" id="dl">Download settings.json</button>
          <button class="btn ghost" data-copy="link">Copy shareable link</button>
        </div>`}
  </div>`;
  wire();
}

/* ══════════════════════════════════════════════════════════════════════════
   EVENTS
   ══════════════════════════════════════════════════════════════════════════ */
function wire() {
  document.querySelectorAll("[data-try]").forEach(b => b.onclick = () => {
    S.q = b.dataset.try; S.view = "catalog"; S.open = null; render(); });
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    S.open = b.dataset.open; window.scrollTo(0, 0); render(); });
  document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => {
    S.open = null; S.view = "catalog"; render(); });
  document.querySelectorAll("button.f").forEach(b => b.onclick = () => {
    const { f, v } = b.dataset;
    if (f === "type") S.types.has(v) ? S.types.delete(v) : S.types.add(v);
    if (f === "plugin") S.plugins.has(v) ? S.plugins.delete(v) : S.plugins.add(v);
    if (f === "evals") S.evalsOnly = !S.evalsOnly;
    render(); });
  const cf = () => { S.types.clear(); S.plugins.clear(); S.evalsOnly = false; render(); };
  const c1 = document.getElementById("clearf"); if (c1) c1.onclick = cf;
  const c2 = document.getElementById("clearf2"); if (c2) c2.onclick = cf;
  document.querySelectorAll("[data-pick]").forEach(cb => cb.onchange = () => {
    cb.checked ? S.sel.add(cb.dataset.pick) : S.sel.delete(cb.dataset.pick);
    render(); syncTray(); });
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b));
  const dl = document.getElementById("dl");
  if (dl) dl.onclick = () => {
    const url = URL.createObjectURL(new Blob([bundleJSON()], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = "settings.json"; a.click();
    URL.revokeObjectURL(url);
    toast("settings.json downloaded");
  };
  syncTray();
}

function copy(b) {
  const [kind, arg] = b.dataset.copy.split(":");
  let text = "";
  if (kind === "install") text = `/plugin marketplace add ${REPO}\n/plugin install ${arg}@${MARKET}`;
  if (kind === "raw") { const a = A.find(x => x.id === arg); text = `---\nname: ${a.id}\ndescription: ${a.desc}\n---\n\n${a.body}`; }
  if (kind === "bundle") text = bundleJSON();
  if (kind === "link") text = location.href;
  navigator.clipboard?.writeText(text);
  b.classList.add("done"); const t = b.textContent; b.textContent = "Copied";
  setTimeout(() => { b.classList.remove("done"); b.textContent = t; }, 1300);
  toast(kind === "install" ? "Both commands copied" : "Copied to clipboard");
}

let tt;
function toast(m) {
  const el = document.getElementById("toast");
  el.textContent = m; el.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1800);
}

function syncTray() {
  const tray = document.getElementById("tray");
  tray.classList.toggle("up", S.sel.size > 0 && S.view !== "bundle");
  document.getElementById("trayn").textContent = S.sel.size;
  document.getElementById("traynames").innerHTML =
    [...S.sel].slice(0, 6).map(id => `<span>${escape_(id)}</span>`).join("") +
    (S.sel.size > 6 ? `<span>+${S.sel.size - 6}</span>` : "");
}
document.getElementById("trayclear").onclick = () => { S.sel.clear(); render(); };
document.getElementById("traygo").onclick = () => { S.view = "bundle"; S.open = null; window.scrollTo(0, 0); render(); };

document.getElementById("nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.view = b.dataset.view; S.open = null; window.scrollTo(0, 0); render();
});

/* Theme — dark is the default in every state; the toggle is an explicit stamp. */
const themeBtn = document.getElementById("theme");
function labelTheme() {
  const stamped = document.documentElement.getAttribute("data-theme");
  const light = stamped === "light" ||
    (!stamped && window.matchMedia("(prefers-color-scheme: light)").matches);
  themeBtn.textContent = light ? "Dark" : "Light";
}
themeBtn.onclick = () => {
  const stamped = document.documentElement.getAttribute("data-theme");
  const light = stamped === "light" ||
    (!stamped && window.matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.setAttribute("data-theme", light ? "dark" : "light");
  try { localStorage.setItem("dd-theme", light ? "dark" : "light"); } catch {}
  labelTheme();
};
try { const t = localStorage.getItem("dd-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch {}
labelTheme();

function escape_(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function attr(s) { return escape_(s); }

readHash();
render();
</script>
</body>
</html>
