<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 632" width="100%" role="img" aria-label="DevDigest review loop. GitHub supplies pull requests and diffs to the server. The server indexes the repository with repo-intel, whose repo map plus the diff go to reviewer-core, which prompts the model. Every finding passes a grounding gate: real file references are kept in Postgres, invented ones are dropped and counted. Kept findings reach the studio, where accepting or dismissing returns to the server.">
